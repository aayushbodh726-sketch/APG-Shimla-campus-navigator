<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a5f2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>APG Shimla University - Campus Navigator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://apg-shimla-campus-navigator.onrender.com">
    <style>
        :root {
            --primary: #1a5f2a;
            --primary-light: #2d8a3e;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }
        .app { display: flex; height: 100vh; width: 100vw; }
        .sidebar { width: 380px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 1000; transition: transform 0.3s ease; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; }
        .sidebar-header h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .sidebar-header p { font-size: 0.8rem; opacity: 0.9; margin-top: 4px; }
        .sidebar-header .logo-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .search-section { padding: 16px; border-bottom: 1px solid var(--border); }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 12px 16px 12px 44px; border: 2px solid var(--border); border-radius: 12px; font-size: 0.95rem; font-family: inherit; transition: all 0.2s; background: var(--bg); }
        .search-box input:focus { outline: none; border-color: var(--primary-light); background: white; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .directions-panel { padding: 16px; border-bottom: 1px solid var(--border); background: #f1f5f9; }
        .directions-toggle { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; color: var(--primary); }
        .directions-inputs { margin-top: 12px; display: none; animation: slideDown 0.3s ease; }
        .directions-inputs.active { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .dir-input-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; background: white; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); }
        .dir-input-group i { color: var(--text-muted); font-size: 0.9rem; }
        .dir-input-group input { border: none; outline: none; font-family: inherit; font-size: 0.9rem; width: 100%; background: transparent; }
        .dir-input-group.from i { color: var(--primary-light); }
        .dir-input-group.to i { color: #dc2626; }
        .route-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 10px; font-family: inherit; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .route-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
        .filters { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: white; font-size: 0.8rem; font-weight: 500; cursor: pointer; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .filter-chip:hover, .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        .building-list { flex: 1; overflow-y: auto; padding: 8px; }
        .building-list::-webkit-scrollbar { width: 6px; }
        .building-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .building-card { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; }
        .building-card:hover { background: #f1f5f9; }
        .building-card.active { background: #ecfdf5; border: 1px solid #a7f3d0; }
        .building-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .building-icon.academic { background: #dbeafe; color: #1d4ed8; }
        .building-icon.admin { background: #fef3c7; color: #b45309; }
        .building-icon.hostel { background: #fce7f3; color: #be185d; }
        .building-icon.food { background: #d1fae5; color: #047857; }
        .building-icon.sports { background: #ede9fe; color: #6d28d9; }
        .building-icon.medical { background: #fee2e2; color: #b91c1c; }
        .building-icon.library { background: #cffafe; color: #0e7490; }
        .building-icon.transport { background: #ffedd5; color: #c2410c; }
        .building-info h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
        .building-info p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }
        .building-meta { display: flex; gap: 10px; margin-top: 6px; }
        .building-meta span { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        .map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 16px; padding: 0; overflow: hidden; box-shadow: var(--shadow-lg); }
        .custom-popup .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-header { padding: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; }
        .popup-header h3 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
        .popup-header .popup-category { font-size: 0.75rem; opacity: 0.9; text-transform: uppercase; letter-spacing: 0.5px; }
        .popup-body { padding: 14px 16px; }
        .popup-body p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px; }
        .popup-actions { display: flex; gap: 8px; }
        .popup-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: white; font-family: inherit; font-size: 0.8rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; }
        .popup-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
        .popup-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
        .map-controls { position: absolute; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 500; }
        .map-control-btn { width: 44px; height: 44px; border-radius: 12px; background: white; border: none; box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: var(--text); cursor: pointer; transition: all 0.2s; }
        .map-control-btn:hover { background: var(--primary); color: white; transform: scale(1.05); }
        .mobile-toggle { display: none; position: absolute; top: 16px; left: 16px; z-index: 500; width: 44px; height: 44px; border-radius: 12px; background: white; border: none; box-shadow: var(--shadow-lg); align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        .route-info { position: absolute; top: 16px; right: 16px; background: white; padding: 16px 20px; border-radius: 16px; box-shadow: var(--shadow-lg); z-index: 500; display: none; min-width: 200px; }
        .route-info.active { display: block; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .route-info h4 { font-size: 0.9rem; margin-bottom: 8px; color: var(--primary); }
        .route-stat { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .route-stat i { color: var(--accent); }
        .legend { position: absolute; bottom: 24px; left: 24px; background: white; padding: 14px 18px; border-radius: 14px; box-shadow: var(--shadow-lg); z-index: 500; }
        .legend h4 { font-size: 0.8rem; font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 6px; color: var(--text); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .no-results { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .no-results i { font-size: 3rem; margin-bottom: 12px; opacity: 0.5; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 16px; font-weight: 600; color: var(--text-muted); }
        .offline-badge { position: absolute; top: 16px; right: 16px; background: #dc2626; color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; z-index: 500; display: none; }
        .offline-badge.active { display: block; }
        @media (max-width: 768px) {
            .sidebar { position: absolute; top: 0; left: 0; height: 100%; transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: flex; }
            .map-container { width: 100%; }
            .legend { display: none; }
            .route-info { top: 70px; right: 10px; left: 10px; min-width: auto; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading Campus Map...</div>
    </div>
    <div class="offline-badge" id="offlineBadge"><i class="fas fa-wifi"></i> Offline Mode</div>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1><div class="logo-icon"><i class="fas fa-university"></i></div>APG Shimla University</h1>
                <p>Campus Navigator · 44 Acres · Hilltop · GPS: 31.0667°N, 77.1667°E</p>
            </div>
            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search buildings, departments, facilities...">
                </div>
            </div>
            <div class="directions-panel">
                <div class="directions-toggle" onclick="toggleDirections()">
                    <i class="fas fa-route"></i><span>Get Directions</span>
                    <i class="fas fa-chevron-down" id="dirChevron" style="margin-left:auto;transition:transform 0.3s"></i>
                </div>
                <div class="directions-inputs" id="dirInputs">
                    <div class="dir-input-group from"><i class="fas fa-circle" style="font-size:0.6rem"></i><input type="text" id="fromInput" placeholder="From (e.g., Main Gate)" list="buildingsList"></div>
                    <div class="dir-input-group to"><i class="fas fa-location-dot"></i><input type="text" id="toInput" placeholder="To (e.g., Library)" list="buildingsList"></div>
                    <button class="route-btn" onclick="calculateRoute()"><i class="fas fa-paper-plane"></i> Show Route</button>
                </div>
            </div>
            <div class="filters">
                <div class="filter-chip active" data-filter="all" onclick="filterBuildings('all')"><i class="fas fa-th-large"></i> All</div>
                <div class="filter-chip" data-filter="academic" onclick="filterBuildings('academic')"><i class="fas fa-graduation-cap"></i> Academic</div>
                <div class="filter-chip" data-filter="admin" onclick="filterBuildings('admin')"><i class="fas fa-building"></i> Admin</div>
                <div class="filter-chip" data-filter="hostel" onclick="filterBuildings('hostel')"><i class="fas fa-bed"></i> Hostel</div>
                <div class="filter-chip" data-filter="food" onclick="filterBuildings('food')"><i class="fas fa-utensils"></i> Food</div>
                <div class="filter-chip" data-filter="sports" onclick="filterBuildings('sports')"><i class="fas fa-basketball"></i> Sports</div>
                <div class="filter-chip" data-filter="medical" onclick="filterBuildings('medical')"><i class="fas fa-heart-pulse"></i> Medical</div>
            </div>
            <div class="building-list" id="buildingList"></div>
        </aside>
        <main class="map-container">
            <button class="mobile-toggle" id="mobileToggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div id="map"></div>
            <div class="route-info" id="routeInfo">
                <h4><i class="fas fa-route"></i> Route Details</h4>
                <div class="route-stat"><i class="fas fa-road"></i> <span id="routeDistance">-</span></div>
                <div class="route-stat"><i class="fas fa-clock"></i> <span id="routeTime">-</span></div>
                <div class="route-stat"><i class="fas fa-shoe-prints"></i> <span id="routeSteps">-</span></div>
                <button class="popup-btn" style="margin-top:10px;width:100%" onclick="clearRoute()"><i class="fas fa-times"></i> Clear Route</button>
            </div>
            <div class="legend">
                <h4>Legend</h4>
                <div class="legend-item"><div class="legend-dot" style="background:#1d4ed8"></div> Academic</div>
                <div class="legend-item"><div class="legend-dot" style="background:#b45309"></div> Admin</div>
                <div class="legend-item"><div class="legend-dot" style="background:#be185d"></div> Hostel</div>
                <div class="legend-item"><div class="legend-dot" style="background:#047857"></div> Food</div>
                <div class="legend-item"><div class="legend-dot" style="background:#6d28d9"></div> Sports</div>
                <div class="legend-item"><div class="legend-dot" style="background:#b91c1c"></div> Medical</div>
            </div>
            <div class="map-controls">
                <button class="map-control-btn" onclick="locateUser()" title="My Location"><i class="fas fa-crosshairs"></i></button>
                <button class="map-control-btn" onclick="resetView()" title="Reset View"><i class="fas fa-compress-arrows-alt"></i></button>
                <button class="map-control-btn" onclick="toggleSatellite()" title="Toggle Satellite"><i class="fas fa-satellite"></i></button>
                <button class="map-control-btn" onclick="shareLocation()" title="Share"><i class="fas fa-share-alt"></i></button>
            </div>
        </main>
    </div>
    <datalist id="buildingsList"></datalist>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ========== REAL GPS COORDINATES ==========
        // Center: 31.0667°N, 77.1667°E (Wikipedia verified)
        // Address: Shoghi-Mehli Bypass Road, Lower Panthaghati, Shimla 171009, HP, India
        const CAMPUS_CENTER = [31.0670, 77.1683];
        const API_BASE = window.location.origin.includes('localhost') ? 'http://localhost:3000/api' : '/api';

        const buildings = [
            {id:1,name:"Main Gate / Entrance",category:"admin",lat:31.0652,lng:77.1655,icon:"fa-door-open",floors:"Ground",timing:"24/7",description:"Main entry point with security checkpoint and visitor registration desk."},
            {id:2,name:"Administrative Block",category:"admin",lat:31.0658,lng:77.1660,icon:"fa-building",floors:"3 Floors",timing:"9:00 AM - 5:00 PM",description:"Registrar, Accounts, Admissions, and VC Office."},
            {id:3,name:"School of Engineering & Technology",category:"academic",lat:31.0665,lng:77.1665,icon:"fa-microchip",floors:"4 Floors",timing:"8:30 AM - 5:00 PM",description:"B.Tech, M.Tech. Labs: Computer, Electronics, Mechanical, Civil workshops."},
            {id:4,name:"School of Advance Computing",category:"academic",lat:31.0670,lng:77.1670,icon:"fa-laptop-code",floors:"3 Floors",timing:"8:30 AM - 5:00 PM",description:"BCA, MCA, B.Sc IT, M.Sc IT. Advanced computer labs with cloud infrastructure."},
            {id:5,name:"School of Management",category:"academic",lat:31.0675,lng:77.1675,icon:"fa-chart-line",floors:"3 Floors",timing:"8:30 AM - 5:00 PM",description:"BBA, MBA. Case study rooms, presentation halls, business simulation labs."},
            {id:6,name:"School of Legal Studies & Research",category:"academic",lat:31.0680,lng:77.1680,icon:"fa-scale-balanced",floors:"3 Floors",timing:"8:30 AM - 5:00 PM",description:"BA LLB, LLB, LLM. Moot court hall and legal research center."},
            {id:7,name:"School of Journalism & Mass Communication",category:"academic",lat:31.0685,lng:77.1685,icon:"fa-video",floors:"2 Floors",timing:"8:30 AM - 5:00 PM",description:"BJMC, MJMC. TV studio, radio station, editing suites, photography lab."},
            {id:8,name:"School of Design",category:"academic",lat:31.0690,lng:77.1690,icon:"fa-palette",floors:"2 Floors",timing:"8:30 AM - 5:00 PM",description:"B.Des, M.Des. Design studios, fabrication lab, 3D printing, exhibition hall."},
            {id:9,name:"School of Architecture & Planning",category:"academic",lat:31.0695,lng:77.1695,icon:"fa-drafting-compass",floors:"4 Floors",timing:"8:30 AM - 5:00 PM",description:"B.Arch, M.Arch. Design studios, model-making workshop, climatology lab."},
            {id:10,name:"School of Sciences",category:"academic",lat:31.0700,lng:77.1700,icon:"fa-flask",floors:"3 Floors",timing:"8:30 AM - 5:00 PM",description:"B.Sc, M.Sc Physics, Chemistry, Maths, Biotechnology. Well-equipped science labs."},
            {id:11,name:"School of Hospitality & Tourism",category:"academic",lat:31.0705,lng:77.1705,icon:"fa-hotel",floors:"3 Floors",timing:"8:30 AM - 5:00 PM",description:"BHM, MHM. Training kitchen, bakery, mock restaurant, front office lab."},
            {id:12,name:"School of Art & Humanities",category:"academic",lat:31.0710,lng:77.1710,icon:"fa-book-open",floors:"2 Floors",timing:"8:30 AM - 5:00 PM",description:"BA, MA English, Psychology, Sociology, Political Science. Seminar halls, language lab."},
            {id:13,name:"School of Para Medical Sciences",category:"academic",lat:31.0715,lng:77.1715,icon:"fa-user-nurse",floors:"3 Floors",timing:"8:30 AM - 5:00 PM",description:"Nursing, MLT, Radiology. Anatomy lab and clinical training center."},
            {id:14,name:"Central Library",category:"library",lat:31.0668,lng:77.1678,icon:"fa-book",floors:"3 Floors",timing:"8:00 AM - 10:00 PM",description:"50,000+ books, digital library, e-journals, reading halls, discussion rooms."},
            {id:15,name:"Main Auditorium",category:"admin",lat:31.0662,lng:77.1672,icon:"fa-theater-masks",floors:"2 Floors",timing:"Event-based",description:"1000+ capacity auditorium for convocations, seminars, cultural programs."},
            {id:16,name:"Boys Hostel A",category:"hostel",lat:31.0650,lng:77.1680,icon:"fa-bed",floors:"4 Floors",timing:"24/7",description:"AC/Non-AC rooms, WiFi, mess, gym, common room. Capacity: 200 students."},
            {id:17,name:"Boys Hostel B",category:"hostel",lat:31.0645,lng:77.1685,icon:"fa-bed",floors:"4 Floors",timing:"24/7",description:"AC/Non-AC rooms, WiFi, mess, study rooms. Capacity: 200 students."},
            {id:18,name:"Girls Hostel",category:"hostel",lat:31.0640,lng:77.1690,icon:"fa-bed",floors:"4 Floors",timing:"24/7",description:"Secure AC/Non-AC accommodation, WiFi, mess, recreation. Capacity: 250 students."},
            {id:19,name:"Main Cafeteria",category:"food",lat:31.0655,lng:77.1670,icon:"fa-utensils",floors:"Ground + 1",timing:"7:00 AM - 10:00 PM",description:"Multi-cuisine food court, juice bar, bakery. Breakfast, lunch, dinner, snacks."},
            {id:20,name:"Cafeteria 2 (Night Canteen)",category:"food",lat:31.0648,lng:77.1682,icon:"fa-mug-hot",floors:"Ground",timing:"6:00 PM - 2:00 AM",description:"Late-night food spot near hostels. Maggi, snacks, tea, coffee."},
            {id:21,name:"Sports Complex",category:"sports",lat:31.0635,lng:77.1665,icon:"fa-futbol",floors:"Open Ground",timing:"5:00 AM - 8:00 PM",description:"Cricket ground, football field, basketball, volleyball, athletics track."},
            {id:22,name:"Indoor Sports Hall",category:"sports",lat:31.0630,lng:77.1670,icon:"fa-table-tennis",floors:"2 Floors",timing:"6:00 AM - 9:00 PM",description:"Badminton, table tennis, chess, carrom, yoga hall."},
            {id:23,name:"Gym & Fitness Center",category:"sports",lat:31.0625,lng:77.1675,icon:"fa-dumbbell",floors:"Ground + 1",timing:"5:00 AM - 10:00 PM",description:"Modern gym equipment, cardio zone, personal trainers, aerobics room."},
            {id:24,name:"Health Center / Medical Room",category:"medical",lat:31.0660,lng:77.1660,icon:"fa-heart-pulse",floors:"Ground",timing:"24/7",description:"24/7 medical facility with doctor on call, ambulance, first aid, pharmacy."},
            {id:25,name:"ATM & Banking Point",category:"admin",lat:31.0656,lng:77.1658,icon:"fa-credit-card",floors:"Kiosk",timing:"24/7",description:"ATM kiosk and mini banking services for students and staff."},
            {id:26,name:"Parking Area",category:"transport",lat:31.0648,lng:77.1650,icon:"fa-car",floors:"Open",timing:"24/7",description:"Student and faculty parking. Separate two-wheeler and four-wheeler zones."},
            {id:27,name:"Bus Stop / Transport Office",category:"transport",lat:31.0650,lng:77.1652,icon:"fa-bus",floors:"Kiosk",timing:"7:00 AM - 7:00 PM",description:"University bus stand and transport office for shuttle services."},
            {id:28,name:"Open Air Theatre (OAT)",category:"sports",lat:31.0642,lng:77.1668,icon:"fa-music",floors:"Open",timing:"Event-based",description:"Outdoor amphitheater for cultural events, movie nights, performances."},
            {id:29,name:"Temple / Prayer Hall",category:"admin",lat:31.0678,lng:77.1698,icon:"fa-place-of-worship",floors:"Ground",timing:"6:00 AM - 8:00 PM",description:"Campus temple for daily prayers and meditation. Peaceful hilltop location."},
            {id:30,name:"Department of Agriculture",category:"academic",lat:31.0708,lng:77.1708,icon:"fa-seedling",floors:"2 Floors",timing:"8:30 AM - 5:00 PM",description:"B.Sc Agriculture, M.Sc Agriculture. Farm labs, greenhouse, soil testing lab."},
        ];

        let map, markers = {}, currentRoute = null, activeBuilding = null, isSatellite = false;
        let routeLine = null, routeStartMarker = null, routeEndMarker = null;
        let userMarker = null;

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            populateDatalist();
            renderBuildingList(buildings);
            setupOfflineDetection();
            setTimeout(() => document.getElementById('loading').classList.add('hidden'), 1500);
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                renderBuildingList(buildings.filter(b => b.name.toLowerCase().includes(q) || b.description.toLowerCase().includes(q) || b.category.toLowerCase().includes(q)));
            });
        });

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView(CAMPUS_CENTER, 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '© OpenStreetMap' }).addTo(map);

            // Campus boundary polygon (approximate 44-acre boundary)
            L.polygon([
                [31.0620, 77.1645], [31.0620, 77.1720],
                [31.0720, 77.1720], [31.0720, 77.1645]
            ], { color: '#1a5f2a', weight: 2, fillColor: '#1a5f2a', fillOpacity: 0.03, dashArray: '10, 10' }).addTo(map).bindPopup("<b>APG Shimla University</b><br>44 Acres · Shoghi-Mehli Bypass<br>Shimla 171009, HP, India");

            buildings.forEach(b => addMarker(b));
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        function addMarker(b) {
            const colors = { academic:'#1d4ed8', admin:'#b45309', hostel:'#be185d', food:'#047857', sports:'#6d28d9', medical:'#b91c1c', library:'#0e7490', transport:'#c2410c' };
            const color = colors[b.category] || '#1a5f2a';
            const icon = L.divIcon({
                html: `<div style="background:${color};color:white;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.4);font-size:0.8rem;"><i class="fas ${b.icon}"></i></div>`,
                className: 'custom-div-icon', iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32]
            });
            const marker = L.marker([b.lat, b.lng], { icon }).addTo(map);
            marker.bindPopup(`<div class="popup-header"><div class="popup-category">${b.category.toUpperCase()}</div><h3>${b.name}</h3></div><div class="popup-body"><p>${b.description}</p><div class="building-meta" style="margin-bottom:12px"><span><i class="fas fa-layer-group"></i> ${b.floors}</span><span><i class="fas fa-clock"></i> ${b.timing}</span></div><div class="popup-actions"><button class="popup-btn primary" onclick="getDirectionsTo('${b.name}')"><i class="fas fa-route"></i> Directions</button><button class="popup-btn" onclick="zoomToBuilding(${b.id})"><i class="fas fa-expand"></i> Zoom</button></div></div>`, { className: 'custom-popup', closeButton: true });
            marker.on('click', () => highlightBuilding(b.id));
            markers[b.id] = marker;
        }

        function renderBuildingList(list) {
            const container = document.getElementById('buildingList');
            if (list.length === 0) { container.innerHTML = '<div class="no-results"><i class="fas fa-search-location"></i><p>No buildings found</p></div>'; return; }
            container.innerHTML = list.map(b => `<div class="building-card" data-id="${b.id}" onclick="selectBuilding(${b.id})"><div class="building-icon ${b.category}"><i class="fas ${b.icon}"></i></div><div class="building-info"><h3>${b.name}</h3><p>${b.description.substring(0,70)}...</p><div class="building-meta"><span><i class="fas fa-layer-group"></i> ${b.floors}</span><span><i class="fas fa-clock"></i> ${b.timing}</span></div></div></div>`).join('');
        }

        function selectBuilding(id) {
            const b = buildings.find(b => b.id === id); if (!b) return;
            highlightBuilding(id);
            map.flyTo([b.lat, b.lng], 18, { duration: 1.5 });
            setTimeout(() => markers[id].openPopup(), 1600);
            if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
        }

        function highlightBuilding(id) {
            document.querySelectorAll('.building-card').forEach(c => c.classList.remove('active'));
            const card = document.querySelector(`.building-card[data-id="${id}"]`);
            if (card) { card.classList.add('active'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
            activeBuilding = id;
        }

        function filterBuildings(category) {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-filter="${category}"]`).classList.add('active');
            const filtered = category === 'all' ? buildings : buildings.filter(b => b.category === category);
            renderBuildingList(filtered);
            buildings.forEach(b => { if (category === 'all' || b.category === category) map.addLayer(markers[b.id]); else map.removeLayer(markers[b.id]); });
        }

        function toggleDirections() {
            const inputs = document.getElementById('dirInputs');
            const chevron = document.getElementById('dirChevron');
            inputs.classList.toggle('active');
            chevron.style.transform = inputs.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function populateDatalist() {
            document.getElementById('buildingsList').innerHTML = buildings.map(b => `<option value="${b.name}">`).join('');
        }

        function getDirectionsTo(dest) { toggleDirections(); document.getElementById('toInput').value = dest; document.getElementById('fromInput').focus(); }

        function calculateRoute() {
            const fromName = document.getElementById('fromInput').value.trim();
            const toName = document.getElementById('toInput').value.trim();
            if (!fromName || !toName) { alert('Please enter both starting point and destination.'); return; }
            const from = buildings.find(b => b.name.toLowerCase() === fromName.toLowerCase());
            const to = buildings.find(b => b.name.toLowerCase() === toName.toLowerCase());
            if (!from) { alert(`Building "${fromName}" not found.`); return; }
            if (!to) { alert(`Building "${toName}" not found.`); return; }
            clearRoute();

            // Try to fetch from backend API first, fallback to straight line
            fetchRoute(from, to);
        }

        async function fetchRoute(from, to) {
            try {
                const res = await fetch(`${API_BASE}/directions?fromLat=${from.lat}&fromLng=${from.lng}&toLat=${to.lat}&toLng=${to.lng}`);
                if (res.ok) {
                    const data = await res.json();
                    drawRoute(data.path, from, to, data.distance, data.duration, data.steps);
                    return;
                }
            } catch (e) { console.log('API unavailable, using fallback'); }
            // Fallback: straight line
            const dist = getDistance(from.lat, from.lng, to.lat, to.lng);
            const time = Math.ceil(dist / 5 * 60);
            const steps = Math.ceil(dist * 1000 / 0.7); // ~70cm per step
            drawRoute([[from.lat, from.lng], [to.lat, to.lng]], from, to, dist, time, steps);
        }

        function drawRoute(path, from, to, distance, duration, steps) {
            routeLine = L.polyline(path, { color: '#1a5f2a', weight: 5, opacity: 0.8, dashArray: '12, 8', lineCap: 'round' }).addTo(map);
            const startIcon = L.divIcon({ html: '<div style="background:#1a5f2a;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"><i class="fas fa-play" style="font-size:0.6rem"></i></div>', iconSize: [28,28], iconAnchor: [14,14] });
            const endIcon = L.divIcon({ html: '<div style="background:#dc2626;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"><i class="fas fa-location-dot" style="font-size:0.7rem"></i></div>', iconSize: [28,28], iconAnchor: [14,14] });
            routeStartMarker = L.marker([from.lat, from.lng], { icon: startIcon }).addTo(map);
            routeEndMarker = L.marker([to.lat, to.lng], { icon: endIcon }).addTo(map);
            document.getElementById('routeDistance').textContent = (typeof distance === 'number' ? distance.toFixed(2) : distance) + ' km';
            document.getElementById('routeTime').textContent = duration + ' min walk';
            document.getElementById('routeSteps').textContent = (typeof steps === 'number' ? steps.toLocaleString() : steps) + ' steps';
            document.getElementById('routeInfo').classList.add('active');
            map.fitBounds(routeLine.getBounds(), { padding: [50,50] });
        }

        function clearRoute() {
            if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
            if (routeStartMarker) { map.removeLayer(routeStartMarker); routeStartMarker = null; }
            if (routeEndMarker) { map.removeLayer(routeEndMarker); routeEndMarker = null; }
            document.getElementById('routeInfo').classList.remove('active');
            document.getElementById('fromInput').value = '';
            document.getElementById('toInput').value = '';
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function locateUser() {
            if (!navigator.geolocation) { alert('Geolocation not supported.'); return; }
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.circleMarker([lat, lng], { radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8 }).addTo(map).bindPopup('You are here').openPopup();
                map.flyTo([lat, lng], 17);
                // Check if inside campus
                const dist = getDistance(lat, lng, CAMPUS_CENTER[0], CAMPUS_CENTER[1]);
                if (dist > 0.8) alert('You appear to be outside the campus area.');
            }, () => alert('Unable to retrieve location.'));
        }

        function resetView() { map.flyTo(CAMPUS_CENTER, 16); clearRoute(); document.querySelectorAll('.building-card').forEach(c => c.classList.remove('active')); }

        function toggleSatellite() {
            isSatellite = !isSatellite;
            map.eachLayer(l => { if (l instanceof L.TileLayer) map.removeLayer(l); });
            if (isSatellite) L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, attribution: '© Esri' }).addTo(map);
            else L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, attribution: '© OpenStreetMap' }).addTo(map);
        }

        function zoomToBuilding(id) { const b = buildings.find(b => b.id === id); if (b) map.flyTo([b.lat, b.lng], 19); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

        function shareLocation() {
            const url = `https://www.google.com/maps?q=${CAMPUS_CENTER[0]},${CAMPUS_CENTER[1]}`;
            if (navigator.share) navigator.share({ title: 'APG Shimla University', text: 'Visit APG Shimla University Campus', url });
            else { navigator.clipboard.writeText(url); alert('Campus link copied to clipboard!'); }
        }

        function setupOfflineDetection() {
            window.addEventListener('online', () => document.getElementById('offlineBadge').classList.remove('active'));
            window.addEventListener('offline', () => document.getElementById('offlineBadge').classList.add('active'));
            if (!navigator.onLine) document.getElementById('offlineBadge').classList.add('active');
        }

        map && map.on('click', () => { if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open'); });
    </script>
</body>
</html>
